AWSTemplateFormatVersion: "2010-09-09"
Description: Rosewood College V6 EOI and Application for Enrolment service

Parameters:
  ConfigSecretArn:
    Type: String
  SenderEmail:
    Type: String
    Default: enrolment@ffe.org.au
  SenderName:
    Type: String
    Default: Rosewood College Enrolment
  ReplyToEmail:
    Type: String
    Default: enrolment@ffe.org.au
  GoogleEoiFolderId:
    Type: String
  GoogleApplicationFolderId:
    Type: String
  GoogleEoiSpreadsheetId:
    Type: String
  GoogleApplicationSpreadsheetId:
    Type: String
  GoogleOperationsSpreadsheetId:
    Type: String
  AllowedOrigins:
    Type: String
    Default: https://ffe.org.au
  StaffEmails:
    Type: String
    Default: info@ffe.org.au
  StaffRoles:
    Type: String
    Default: info@ffe.org.au=admin
  SecurityNotificationEmail:
    Type: String
    Default: info@ffe.org.au
  SecondarySecurityNotificationEmail:
    Type: String
    Default: frjativa@gmail.com
  PublicSiteBaseUrl:
    Type: String
    Default: https://ffe.org.au
  PublicApiBaseUrl:
    Type: String
    Description: Public Rosewood V6 Lambda Function URL without a trailing slash
  RecordsKmsKeyArn:
    Type: String
    Default: ""
    Description: Existing retained KMS key ARN to reuse after a safe rollback; leave empty for a new stack-managed key
  ExistingAuditTableName:
    Type: String
    Default: ""
    Description: Existing retained append-only audit table to reuse after a safe rollback
  ExistingBackupVaultName:
    Type: String
    Default: ""
    Description: Existing retained locked backup vault to reuse after a safe rollback
Conditions:
  CreateRecordsKey: !Equals [!Ref RecordsKmsKeyArn, ""]
  CreateAuditTable: !Equals [!Ref ExistingAuditTableName, ""]
  CreateBackupVault: !Equals [!Ref ExistingBackupVaultName, ""]

Resources:
  RosewoodKey:
    Type: AWS::KMS::Key
    Condition: CreateRecordsKey
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Rosewood enrolment records and backups
      EnableKeyRotation: true
      PendingWindowInDays: 30
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: EnableAccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"

  RosewoodKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/${AWS::StackName}-records
      TargetKeyId: !If [CreateRecordsKey, !Ref RosewoodKey, !Ref RecordsKmsKeyArn]

  RosewoodTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !If [CreateRecordsKey, !GetAtt RosewoodKey.Arn, !Ref RecordsKmsKeyArn]
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  RosewoodAuditTable:
    Type: AWS::DynamoDB::Table
    Condition: CreateAuditTable
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      DeletionProtectionEnabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
        SSEType: KMS
        KMSMasterKeyId: !If [CreateRecordsKey, !GetAtt RosewoodKey.Arn, !Ref RecordsKmsKeyArn]

  RosewoodDocumentStagingBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !If [CreateRecordsKey, !GetAtt RosewoodKey.Arn, !Ref RecordsKmsKeyArn]
            BucketKeyEnabled: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - !Ref AllowedOrigins
            ExposedHeaders:
              - ETag
              - x-amz-checksum-sha256
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: RemoveTemporaryUploads
            Status: Enabled
            ExpirationInDays: 1
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  RosewoodDocumentStagingBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref RosewoodDocumentStagingBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt RosewoodDocumentStagingBucket.Arn
              - !Sub ${RosewoodDocumentStagingBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  RosewoodSecurityTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Rosewood enrolment security and backup alerts
      KmsMasterKeyId: alias/aws/sns

  RosewoodSecurityTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref RosewoodSecurityTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action:
              - sns:AddPermission
              - sns:DeleteTopic
              - sns:GetTopicAttributes
              - sns:ListSubscriptionsByTopic
              - sns:Publish
              - sns:Receive
              - sns:RemovePermission
              - sns:SetTopicAttributes
              - sns:Subscribe
            Resource: !Ref RosewoodSecurityTopic
          - Sid: ServiceAlerts
            Effect: Allow
            Principal:
              Service:
                - backup.amazonaws.com
                - cloudwatch.amazonaws.com
            Action: sns:Publish
            Resource: !Ref RosewoodSecurityTopic
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId

  RosewoodSecuritySubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref SecurityNotificationEmail
      TopicArn: !Ref RosewoodSecurityTopic

  RosewoodSecondarySecuritySubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: email
      Endpoint: !Ref SecondarySecurityNotificationEmail
      TopicArn: !Ref RosewoodSecurityTopic

  RosewoodBackupRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: backup.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores
      Policies:
        - PolicyName: RosewoodBackupEncryption
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:Decrypt
                  - kms:GenerateDataKey
                Resource: !If [CreateRecordsKey, !GetAtt RosewoodKey.Arn, !Ref RecordsKmsKeyArn]
              - Effect: Allow
                Action: kms:CreateGrant
                Resource: !If [CreateRecordsKey, !GetAtt RosewoodKey.Arn, !Ref RecordsKmsKeyArn]
                Condition:
                  Bool:
                    kms:GrantIsForAWSResource: true

  RosewoodBackupVault:
    Type: AWS::Backup::BackupVault
    Condition: CreateBackupVault
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BackupVaultName: !Sub ${AWS::StackName}-locked
      EncryptionKeyArn: !If [CreateRecordsKey, !GetAtt RosewoodKey.Arn, !Ref RecordsKmsKeyArn]
      LockConfiguration:
        MinRetentionDays: 35
        MaxRetentionDays: 366
      Notifications:
        BackupVaultEvents:
          - BACKUP_JOB_FAILED
          - RESTORE_JOB_FAILED
          - COPY_JOB_FAILED
        SNSTopicArn: !Ref RosewoodSecurityTopic

  RosewoodBackupPlan:
    Type: AWS::Backup::BackupPlan
    Properties:
      BackupPlan:
        BackupPlanName: !Sub ${AWS::StackName}-daily-monthly
        BackupPlanRule:
          - RuleName: Daily35Days
            TargetBackupVault: !If [CreateBackupVault, !Ref RosewoodBackupVault, !Ref ExistingBackupVaultName]
            ScheduleExpression: cron(0 16 * * ? *)
            StartWindowMinutes: 120
            CompletionWindowMinutes: 360
            Lifecycle:
              DeleteAfterDays: 35
          - RuleName: Monthly366Days
            TargetBackupVault: !If [CreateBackupVault, !Ref RosewoodBackupVault, !Ref ExistingBackupVaultName]
            ScheduleExpression: cron(0 17 1 * ? *)
            StartWindowMinutes: 120
            CompletionWindowMinutes: 360
            Lifecycle:
              DeleteAfterDays: 366

  RosewoodBackupSelection:
    Type: AWS::Backup::BackupSelection
    Properties:
      BackupPlanId: !Ref RosewoodBackupPlan
      BackupSelection:
        SelectionName: RosewoodAuthoritativeTables
        IamRoleArn: !GetAtt RosewoodBackupRole.Arn
        Resources:
          - !GetAtt RosewoodTable.Arn
          - !If
            - CreateAuditTable
            - !GetAtt RosewoodAuditTable.Arn
            - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingAuditTableName}

  RosewoodLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-service
      RetentionInDays: 90

  RosewoodRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RosewoodV6Runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AuthoritativeRecords
                Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:TransactWriteItems
                Resource: !GetAtt RosewoodTable.Arn
              - Sid: AppendOnlyAudit
                Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:Query
                  - dynamodb:TransactWriteItems
                Resource: !If
                  - CreateAuditTable
                  - !GetAtt RosewoodAuditTable.Arn
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ExistingAuditTableName}
              - Sid: EncryptedRecordsKeyUse
                Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:Encrypt
                  - kms:GenerateDataKey
                  - kms:ReEncryptFrom
                  - kms:ReEncryptTo
                Resource: !If [CreateRecordsKey, !GetAtt RosewoodKey.Arn, !Ref RecordsKmsKeyArn]
              - Sid: TemporaryDocumentStaging
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${RosewoodDocumentStagingBucket.Arn}/pending/*
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "${ConfigSecretArn}*"
              - Effect: Allow
                Action: ses:SendEmail
                Resource:
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/ffe.org.au
                  - !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/${SenderEmail}
                Condition:
                  StringEquals:
                    ses:FromAddress: !Ref SenderEmail
              - Sid: PublishCanaryMetrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: Rosewood/Enrolment
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${RosewoodLogGroup.Arn}:*

  RosewoodFunction:
    Type: AWS::Lambda::Function
    DependsOn: RosewoodLogGroup
    Properties:
      FunctionName: !Sub ${AWS::StackName}-service
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt RosewoodRole.Arn
      Timeout: 60
      MemorySize: 768
      ReservedConcurrentExecutions: 10
      Code: lambda-dist/
      Environment:
        Variables:
          ROSEWOOD_TABLE_NAME: !Ref RosewoodTable
          ROSEWOOD_AUDIT_TABLE_NAME: !If [CreateAuditTable, !Ref RosewoodAuditTable, !Ref ExistingAuditTableName]
          ROSEWOOD_ARTIFACT_STORE_MODE: google_drive
          ALLOW_UNSCANNED_GOOGLE_DOCUMENTS: "true"
          ROSEWOOD_CONFIG_SECRET_ARN: !Ref ConfigSecretArn
          SENDER_EMAIL: !Ref SenderEmail
          SENDER_NAME: !Ref SenderName
          REPLY_TO_EMAIL: !Ref ReplyToEmail
          GOOGLE_EOI_FOLDER_ID: !Ref GoogleEoiFolderId
          GOOGLE_APPLICATION_FOLDER_ID: !Ref GoogleApplicationFolderId
          GOOGLE_EOI_SPREADSHEET_ID: !Ref GoogleEoiSpreadsheetId
          GOOGLE_APPLICATION_SPREADSHEET_ID: !Ref GoogleApplicationSpreadsheetId
          GOOGLE_OPERATIONS_SPREADSHEET_ID: !Ref GoogleOperationsSpreadsheetId
          DOCUMENT_STAGING_BUCKET: !Ref RosewoodDocumentStagingBucket
          RECORDS_KMS_KEY_ARN: !If [CreateRecordsKey, !GetAtt RosewoodKey.Arn, !Ref RecordsKmsKeyArn]
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          STAFF_EMAILS: !Ref StaffEmails
          STAFF_ROLES: !Ref StaffRoles
          APPLICATION_PAGE_URL: https://ffe.org.au/pages/rosewood-enrolment-v6.html
          APPLICATION_SIGNING_PAGE_URL: https://ffe.org.au/pages/rosewood-application-sign-v6.html
          STAFF_PORTAL_URL: https://ffe.org.au/pages/rosewood-enrolment-admin-v6.html
          PUBLIC_SITE_BASE_URL: !Ref PublicSiteBaseUrl
          PUBLIC_API_BASE_URL: !Ref PublicApiBaseUrl

  RosewoodFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref RosewoodFunction
      AuthType: NONE

  RosewoodFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RosewoodFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  RosewoodFunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RosewoodFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  RosewoodOutboxSchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Retry Rosewood V6 email, Slack notification and Google Sheets projection operations
      ScheduleExpression: rate(1 minute)
      State: ENABLED
      Targets:
        - Arn: !GetAtt RosewoodFunction.Arn
          Id: RosewoodV6Outbox

  RosewoodOutboxPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RosewoodFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RosewoodOutboxSchedule.Arn

  RosewoodCanarySchedule:
    Type: AWS::Events::Rule
    Properties:
      Description: Check the public Rosewood enrolment forms, backend and EOI address configuration
      ScheduleExpression: rate(30 minutes)
      State: ENABLED
      Targets:
        - Arn: !GetAtt RosewoodFunction.Arn
          Id: RosewoodV6ProductionCanary
          Input: '{"source":"rosewood.enrolment.canary","detail-type":"Scheduled Production Canary"}'

  RosewoodCanaryPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RosewoodFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt RosewoodCanarySchedule.Arn

  RosewoodErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Rosewood V6 Lambda errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RosewoodFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref RosewoodSecurityTopic

  RosewoodPublicFormCanaryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Rosewood public enrolment or signing assets failed two consecutive production checks
      Namespace: Rosewood/Enrolment
      MetricName: PublicFormAvailability
      Dimensions:
        - Name: Environment
          Value: production
      Statistic: Minimum
      Period: 1800
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref RosewoodSecurityTopic
      OKActions:
        - !Ref RosewoodSecurityTopic

  RosewoodBackendHealthCanaryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Rosewood backend health or deployed form versions failed two consecutive production checks
      Namespace: Rosewood/Enrolment
      MetricName: BackendHealthAvailability
      Dimensions:
        - Name: Environment
          Value: production
      Statistic: Minimum
      Period: 1800
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref RosewoodSecurityTopic
      OKActions:
        - !Ref RosewoodSecurityTopic

  RosewoodEoiAddressCanaryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Rosewood EOI Google address configuration failed two consecutive production checks
      Namespace: Rosewood/Enrolment
      MetricName: EoiAddressAvailability
      Dimensions:
        - Name: Environment
          Value: production
      Statistic: Minimum
      Period: 1800
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref RosewoodSecurityTopic
      OKActions:
        - !Ref RosewoodSecurityTopic

Outputs:
  FunctionUrl:
    Value: !GetAtt RosewoodFunctionUrl.FunctionUrl
  FunctionName:
    Value: !Ref RosewoodFunction
  TableName:
    Value: !Ref RosewoodTable
  AuditTableName:
    Value: !If [CreateAuditTable, !Ref RosewoodAuditTable, !Ref ExistingAuditTableName]
  DocumentStagingBucketName:
    Value: !Ref RosewoodDocumentStagingBucket
  BackupVaultName:
    Value: !If [CreateBackupVault, !Ref RosewoodBackupVault, !Ref ExistingBackupVaultName]
  BackupRoleArn:
    Value: !GetAtt RosewoodBackupRole.Arn
  KmsKeyArn:
    Value: !If [CreateRecordsKey, !GetAtt RosewoodKey.Arn, !Ref RecordsKmsKeyArn]
  SecurityTopicArn:
    Value: !Ref RosewoodSecurityTopic
  CanaryScheduleName:
    Value: !Ref RosewoodCanarySchedule
