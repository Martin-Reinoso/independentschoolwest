<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#102f43" />
    <meta name="description" content="Rosewood College staff billing portal" />
    <title>Rosewood · Billing</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div id="app">
      <main class="boot" id="main-content" tabindex="-1">
        <div class="brand-mark" aria-hidden="true">R</div>
        <p>Opening your billing workspace…</p>
      </main>
    </div>
    <div id="notice" class="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="workspace-dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
    <dialog id="pdf-preview-dialog" class="pdf-preview" aria-labelledby="pdf-preview-title">
      <div id="pdf-preview-content"></div>
    </dialog>
  </body>
</html>
